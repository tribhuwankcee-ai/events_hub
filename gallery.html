 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<body>
  <header id="top">
    <h1>JNEC Events Hub</h1>
    <nav>
      <a href="index.html" title="Go to home page">Home</a>

        <main>
      <div class="container py-4">

        <h2 class="mb-3">Event Gallery</h2>
        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <img src="media/hackathon.jpg" class="img-fluid rounded shadow-sm" alt="Students brainstorming at the hackathon">
          </div>
          <div class="col-md-4">
            <img src="media/losar.jpg" class="img-fluid rounded shadow-sm" alt="Losar celebration">
          </div>
          <div class="col-md-4">
            <img src="media/football.jpg" class="img-fluid rounded shadow-sm" alt="Inter-college football match">
          </div>
        </div>

        <h2 class="mb-3">Highlights Video</h2>
        <video controls width="480" poster="media/hackathon.jpg" class="rounded shadow-sm mb-4">
          <source src="media/highlights.mp4" type="video/mp4">
          Sorry, your browser does not support the video element.
        </video>

        <h2 class="mb-3">Campus Radio Jingle</h2>
        <audio controls class="mb-4">
          <source src="media/jingle.mp3" type="audio/mpeg">
          Sorry, your browser does not support the audio element.
        </audio>

      </div>
      </main>

  <footer>
