<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JNEC Events Hub — Contact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/styles.css"> 
</head>
<body>
  <header id="top">
    <h1>JNEC Events Hub</h1>
    <nav>
      <a href="index.html" title="Go to home page">Home</a>
      <a href="events.html">Events</a>
      <a href="register.html">Register</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    
    <section id="contact-details" class="intro">
      <h2>Contact Us</h2>
      <address>
        JNEC Events Office<br>
        Jigme Namgyel Engineering College<br>
        Dewathang, Samdrup Jongkhar, Bhutan
      </address>
      <p>Email: <a href="mailto:events@jnec.edu.bt">events@jnec.edu.bt</a></p>
      <p>Phone: +975-77-123456</p>
    </section>

    <section id="contact-map">
      <h2>Find Us</h2>
      <iframe
        src="https://www.openstreetmap.org/export/embed.html?bbox=91.44,26.85,91.48,26.88"
        width="400" height="250" title="Campus map"></iframe>
    </section>
      <section id="enquiry" class="intro">
      <h2>Send an Enquiry</h2>
      <form action="#" method="post" id="enquiryForm">
        <label for="ename">Name</label>
        <input type="text" id="ename" name="name">

        <label for="eemail">Email</label>
        <input type="text" id="eemail" name="email">

        <label for="emessage">Message</label>
        <textarea id="emessage" name="message" rows="4" cols="40"></textarea>

        <button type="submit">Send Enquiry</button>
        <button type="reset">Clear</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 JNEC Events Hub</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
